name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint -- --max-warnings=0

      - name: Run unit tests
        run: bun run test

      - name: Build application
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repairtrack_build
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repairtrack_build
          BETTER_AUTH_SECRET: dummy_secret_for_ci_build_at_least_32_chars_long
          BETTER_AUTH_URL: http://localhost:3000
          GMAIL_CLIENT_ID: dummy_gmail_client_id
          GMAIL_CLIENT_SECRET: dummy_gmail_client_secret
          GMAIL_REDIRECT_URI: http://localhost:3000/api/settings/gmail/callback
          GMAIL_TOKEN_ENCRYPTION_KEY: dXNlX2R1bW15X2tleV8zMl9ieXRlc19mb3JfY2lfMQ==
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: dummy_key
          CLOUDINARY_API_SECRET: dummy_secret
          CLOUDINARY_PRESET_KEY: dummy_preset
